<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">网站健康监测服务架构</title>
  <desc id="desc">HTTP 客户端调用 Axum Router；Router 通过 HealthChecker 访问目标网站，通过 MonitorRepository 访问内存或 SQLite。依赖方向从边缘指向领域接口。</desc>
  <rect width="960" height="390" fill="#fff"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
  <style>.box{fill:none;stroke:#222;stroke-width:2;rx:10}.dash{fill:none;stroke:#222;stroke-width:2;stroke-dasharray:8 6;rx:10}.line{stroke:#222;stroke-width:2;marker-end:url(#arrow)}.label{font:20px system-ui,sans-serif;fill:#222}.small{font:16px system-ui,sans-serif;fill:#222}</style>
  <rect x="35" y="145" width="170" height="80" class="box"/><text x="68" y="190" class="label">HTTP 客户端</text>
  <line x1="210" y1="185" x2="335" y2="185" class="line"/>
  <rect x="340" y="120" width="260" height="130" class="dash"/><text x="400" y="165" class="label">Axum Router</text><text x="375" y="198" class="small">提取请求 / 状态码 / JSON</text><text x="397" y="225" class="small">不实现网络或 SQL</text>
  <line x1="600" y1="155" x2="725" y2="90" class="line"/><line x1="600" y1="220" x2="725" y2="285" class="line"/>
  <rect x="730" y="40" width="195" height="100" class="box"/><text x="760" y="82" class="label">HealthChecker</text><text x="758" y="112" class="small">timeout / retry / limit</text>
  <rect x="730" y="250" width="195" height="100" class="box"/><text x="748" y="292" class="label">MonitorRepository</text><text x="768" y="322" class="small">memory / SQLite</text>
  <text x="35" y="355" class="small">领域类型位于中心；reqwest、Axum、SQLx 是边缘工具，不改变所有权与错误模型。</text>
</svg>
