# The format version is an indicator of the compatibility of community exercises with the
# Rustlings program.
# The format version is not the same as the version of the Rustlings program.
# In case Rustlings makes an unavoidable breaking change to the expected format of community
# exercises, you would need to raise this version and adapt to the new format.
# Otherwise, the newest version of the Rustlings program won't be able to run these exercises.
format_version = 1

welcome_message = """
欢迎回到 Rust！这 18 题覆盖所有权、错误、集合、生命周期、trait、并发、异步与 Web 状态。
先读编译器错误，再按 h 查看方向提示；不要为了让错误消失而盲目 clone。
"""

final_message = """
18 个练习已完成。现在验证 CLI、异步网络与 Web 检查点：
  cargo test --manifest-path ../Cargo.toml --workspace
"""

[[exercises]]
name = "01_move"
dir = "ownership"
strict_clippy = true
hint = """
找到值真正被移动的那一行。Vec 接收元素的所有权；调试输出应发生在移动之前，或改为读取 Vec 中的元素。不要 clone。
"""

[[exercises]]
name = "02_borrow"
dir = "ownership"
strict_clippy = true
hint = """
label 只读取 MonitorTarget。让参数和调用处都表达借用，而不是把整个目标移进函数。
"""

[[exercises]]
name = "03_mut_borrow"
dir = "ownership"
strict_clippy = true
hint = """
修改需要独占可变借用。检查变量绑定、函数参数、调用表达式这三处是否都表达了可变性。
"""

[[exercises]]
name = "04_result"
dir = "errors"
strict_clippy = true
hint = """
区分“解析失败”和“数字超出 HTTP 状态范围”，让调用者收到错误而不是 panic。
"""

[[exercises]]
name = "05_repository"
dir = "traits"
strict_clippy = true
hint = """
数据源已经拥有 Target；让调用者读取最近目标时不要制造第二份所有权。
"""

[[exercises]]
name = "06_summary"
dir = "iterators"
strict_clippy = true
hint = """
从借用的状态切片计算 2xx 数量，不修改输入，也不创建中间集合。
"""

[[exercises]]
name = "07_lifetimes"
dir = "lifetimes"
strict_clippy = true
hint = """
返回引用必须来自两个输入之一；标注应描述输入与输出的关系。
"""

[[exercises]]
name = "08_borrowed_struct"
dir = "lifetimes"
strict_clippy = true
hint = """
让 Selection 借用 names 中已有的 String，不要 clone 或创建局部所有者。
"""

[[exercises]]
name = "09_borrowed_slice"
dir = "lifetimes"
strict_clippy = true
hint = """
返回值必须是 url 内部的一段切片；局部 String 无法被安全返回。
"""

[[exercises]]
name = "10_collections"
dir = "collections"
strict_clippy = true
hint = """
遍历状态切片，把每个值累计到 healthy 或 other 两个桶。
"""

[[exercises]]
name = "11_modules"
dir = "modules"
strict_clippy = true
hint = """
字段保持私有，只公开能维护非空名称不变量的构造与读取能力。
"""

[[exercises]]
name = "12_threads"
dir = "concurrency"
strict_clippy = true
hint = """
让两个 worker 通过消息转移状态码；主线程只从接收端汇总。
"""

[[exercises]]
name = "13_future"
dir = "async"
strict_clippy = true
hint = """
async fn 调用只产生 future；让第一次 poll 得到预期状态码。
"""

[[exercises]]
name = "14_send_sync"
dir = "concurrency"
strict_clippy = true
hint = """
跨线程共享列表同时需要共享所有权和同步内部修改，二者缺一不可。
"""

[[exercises]]
name = "15_retry_policy"
dir = "async"
strict_clippy = true
hint = """
只有仍有次数且错误属于瞬态类别时才重试。
"""

[[exercises]]
name = "16_backpressure_cancel"
dir = "async"
strict_clippy = true
hint = """
队列已满时第二次 send 必须保持 Pending；让 shutdown 分支结束 select，并确认消息 2 未发送。
"""

[[exercises]]
name = "17_web_state"
dir = "web"
strict_clippy = true
hint = """
AppState 的 clone 必须看到同一目标列表，而不是各自拥有一份 Vec。
"""

[[exercises]]
name = "18_storage_mapping"
dir = "storage"
strict_clippy = true
hint = """
用 enum 的互斥分支决定哪些存储列有值，不要先制造互相矛盾的中间状态。
"""
